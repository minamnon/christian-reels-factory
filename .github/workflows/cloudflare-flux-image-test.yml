name: Cloudflare FLUX Image Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-test-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate two test images with Cloudflare FLUX
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/cloudflare_flux_image_test.py

      - name: Upload generated images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-flux-image-test-${{ github.run_id }}
          path: artifacts/cloudflare-flux-test/
          if-no-files-found: warn
          retention-days: 7
