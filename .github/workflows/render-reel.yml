name: Render Christian Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Reel topic"
        required: true
        type: string
      script:
        description: "Complete reel script"
        required: true
        type: string
      duration_seconds:
        description: "Video duration"
        required: true
        default: "35"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Arabic rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fontconfig \
            libraqm-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            pkg-config

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/render/requirements.txt

      - name: Verify Arabic rendering support
        run: |
          python -c "from PIL import features; print('RAQM:', features.check_feature('raqm')); assert features.check_feature('raqm'), 'Pillow RAQM support is missing'"

      - name: Render video
        env:
          REEL_TOPIC: ${{ inputs.topic }}
          REEL_SCRIPT: ${{ inputs.script }}
          REEL_DURATION: ${{ inputs.duration_seconds }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python worker/render/render.py

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: christian-reel
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Publish MP4 as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: reel-${{ github.run_id }}
        run: |
          FILE=$(ls output/*.mp4 | head -n 1)
          gh release create "$TAG" "$FILE" \
            --repo "${{ github.repository }}" \
            --title "Reel $TAG" \
            --notes "Topic: ${{ inputs.topic }}"
          NAME=$(basename "$FILE")
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$NAME"
          echo "Download: $URL"
          echo "### Download link" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
