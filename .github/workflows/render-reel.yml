name: Render Christian Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Reel topic"
        required: true
        type: string
      script:
        description: "Complete reel script"
        required: true
        type: string
      duration_seconds:
        description: "Video duration"
        required: true
        default: "35"
        type: string
      facebook_title:
        description: "Facebook post title"
        required: true
        type: string
      facebook_caption:
        description: "Facebook post caption"
        required: true
        type: string
      facebook_hashtags:
        description: "Facebook post hashtags"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Arabic rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fontconfig \
            libraqm-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            pkg-config

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/render/requirements.txt

      - name: Verify Arabic rendering support
        run: |
          python -c "from PIL import features; print('RAQM:', features.check_feature('raqm')); assert features.check_feature('raqm'), 'Pillow RAQM support is missing'"

      - name: Render video
        env:
          REEL_TOPIC: ${{ inputs.topic }}
          REEL_SCRIPT: ${{ inputs.script }}
          REEL_DURATION: ${{ inputs.duration_seconds }}
          FACEBOOK_TITLE: ${{ inputs.facebook_title }}
          FACEBOOK_CAPTION: ${{ inputs.facebook_caption }}
          FACEBOOK_HASHTAGS: ${{ inputs.facebook_hashtags }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python worker/render/render.py

      - name: Create Facebook post file
        env:
          FACEBOOK_TITLE: ${{ inputs.facebook_title }}
          FACEBOOK_CAPTION: ${{ inputs.facebook_caption }}
          FACEBOOK_HASHTAGS: ${{ inputs.facebook_hashtags }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          title = os.environ["FACEBOOK_TITLE"].strip()
          caption = os.environ["FACEBOOK_CAPTION"].strip()
          hashtags = os.environ["FACEBOOK_HASHTAGS"].strip()
          content = f"{title}\n\n{caption}\n\n{hashtags}\n"
          Path("output/facebook_post.txt").write_text(content, encoding="utf-8")
          Path("facebook_release_notes.md").write_text(
              f"## {title}\n\n{caption}\n\n{hashtags}",
              encoding="utf-8",
          )
          print("Facebook post file created.")

      - name: Upload reel and Facebook post
        uses: actions/upload-artifact@v4
        with:
          name: christian-reel
          path: |
            output/*.mp4
            output/facebook_post.txt
          if-no-files-found: error
          retention-days: 3

      - name: Publish reel and Facebook post as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: reel-${{ github.run_id }}
        run: |
          FILE=$(ls output/*.mp4 | head -n 1)
          gh release create "$TAG" "$FILE" output/facebook_post.txt \
            --repo "${{ github.repository }}" \
            --title "Reel $TAG" \
            --notes-file facebook_release_notes.md
          NAME=$(basename "$FILE")
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$NAME"
          echo "Download: $URL"
          echo "### Download link" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "### Facebook post" >> "$GITHUB_STEP_SUMMARY"
          cat facebook_release_notes.md >> "$GITHUB_STEP_SUMMARY"
