
name: Render Christian Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Reel topic"
        required: true
        type: string
      script:
        description: "Complete reel script"
        required: true
        type: string
      duration_seconds:
        description: "Video duration"
        required: true
        default: "35"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f worker/render/requirements.txt ]; then
            pip install -r worker/render/requirements.txt
          fi

      - name: Render video
        env:
          REEL_TOPIC: ${{ inputs.topic }}
          REEL_SCRIPT: ${{ inputs.script }}
          REEL_DURATION: ${{ inputs.duration_seconds }}
        run: |
          python worker/render/render.py

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: christian-reel
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 3
