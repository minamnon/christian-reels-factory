name: lipsync-test

on:
  workflow_dispatch:
    inputs:
      line:
        description: 'Arabic line spoken by the character'
        required: true
        default: 'يا عم ماتدوسش عليّا! أنا مانجا عسل!'

jobs:
  lipsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate project voice via worker/render/voice.py (Gemini TTS)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          LINE: ${{ inputs.line }}
        run: |
          mkdir -p work
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "worker/render")
          import voice
          out = voice.generate_voice(os.environ["LINE"].strip(), "work")
          assert out, "all voice providers failed"
          print("voice file:", out)
          PY

      - name: Clone Wav2Lip-HD fork (code only, then selected weights)
        run: |
          sudo apt-get update -y && sudo apt-get install -y git-lfs ffmpeg
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://huggingface.co/spaces/manavisrani07/gradio-lipsync-wav2lip w2l
          cd w2l && git lfs pull --include="checkpoints/wav2lip_gan.pth,face_detection/detection/sfd/s3fd.pth"

      - name: Install Python deps
        run: |
          pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.23.5 numba==0.56.4 librosa==0.9.2 opencv-python-headless scipy tqdm addict future yapf lmdb pyyaml scikit-image tb-nightly requests Pillow
          pip install --no-deps gfpgan facexlib
          pip install filterpy

      - name: Decode test asset
        run: base64 -d worker/render/test_assets/test_assets/mango_moving.mp4.b64 > work/mango_moving.mp4

      - name: Stub unused esrgan imports in fork code
        run: |
          cd w2l
          sed -i 's/^from esrgan.upsample import upscale$/upscale = None/' inference.py
          sed -i 's/^from esrgan.upsample import load_sr$/load_sr = None/' inference.py
          grep -n "upscale\|load_sr" inference.py | head -4

      - name: Patch fork to honor fixed face box (cartoon face detection fix)
        run: |
          cd w2l
          python3 - <<'PY'
          src = open('inference.py').read()
          old = """        if frame_to_save is not None:
                      face_detect_result = face_detect([frame_to_save])
                      if len(face_detect_result) > 0:  # Check if face detection was successful
                          face, coords = face_detect_result[0]
                          face = cv2.resize(face, (args.img_size, args.img_size))
                          img_batch.append(face)
                          mel_batch.append(m)
                          frame_batch.append(frame_to_save)
                          coords_batch.append(coords)"""
          new = """        if frame_to_save is not None:
                      if args.box[0] != -1:
                          y1b, y2b, x1b, x2b = args.box
                          face = frame_to_save[y1b:y2b, x1b:x2b]
                          face = cv2.resize(face, (args.img_size, args.img_size))
                          img_batch.append(face)
                          mel_batch.append(m)
                          frame_batch.append(frame_to_save)
                          coords_batch.append((y1b, y2b, x1b, x2b))
                      else:
                          face_detect_result = face_detect([frame_to_save])
                          if len(face_detect_result) > 0:
                              face, coords = face_detect_result[0]
                              face = cv2.resize(face, (args.img_size, args.img_size))
                              img_batch.append(face)
                              mel_batch.append(m)
                              frame_batch.append(frame_to_save)
                              coords_batch.append(coords)"""
          assert old in src, "patch pattern not found"
          open('inference.py','w').write(src.replace(old, new))
          print("patched fixed-box support")
          PY

      - name: Run Wav2Lip lip-sync
        run: |
          cd w2l
          python inference.py \
            --checkpoint_path checkpoints/wav2lip_gan.pth \
            --no_seg --no_sr \
            --face ../work/mango_moving.mp4 \
            --audio ../work/voice.wav \
            --outfile ../work/lipsync_out.mp4 \
            --wav2lip_batch_size 64 \
            --box 30 215 70 270

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: lipsync-result
          path: work/lipsync_out.mp4
