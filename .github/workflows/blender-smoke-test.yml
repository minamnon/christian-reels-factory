name: Blender Human Arabic Lip Sync Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-lipsync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install Blender and dependencies
        run: |
          set -euo pipefail
          mkdir -p /opt/blender /tmp/human-test
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /opt/blender
          echo "/opt/blender" >> "$GITHUB_PATH"
          export PATH="/opt/blender:$PATH"
          sudo apt-get update
          sudo apt-get install -y libegl1 ffmpeg espeak-ng unzip
          ldd /opt/blender/blender | tee /tmp/human-test/ldd.txt
          ! grep -q "not found" /tmp/human-test/ldd.txt
          blender --version

      - name: Install MPFB
        run: |
          set -euo pipefail
          blender --online-mode --command extension install mpfb -e -s
          blender --command extension list | tee /tmp/human-test/extensions.txt
          grep -qi mpfb /tmp/human-test/extensions.txt

      - name: Generate Arabic speech and Rhubarb cues
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip \
            -o /tmp/human-test/rhubarb.zip
          unzip -q /tmp/human-test/rhubarb.zip -d /tmp/human-test/rhubarb
          RHUBARB="$(find /tmp/human-test/rhubarb -type f -name rhubarb -perm -u+x | head -n 1)"
          test -n "$RHUBARB"
          espeak-ng -v ar -s 132 -w /tmp/human-test/arabic.wav \
            "مرحباً بكم. اليوم سنتعلم كيف يمكن للشخصية أن تتحرك وتتحدث بشكل طبيعي."
          test -s /tmp/human-test/arabic.wav
          "$RHUBARB" -r phonetic -f json \
            -o /tmp/human-test/cues.json /tmp/human-test/arabic.wav
          python3 -c 'import json; d=json.load(open("/tmp/human-test/cues.json")); assert d.get("mouthCues"), "No Arabic mouth cues"; print("Arabic mouth cues:",len(d["mouthCues"]))'

      - name: Create and animate MPFB human
        run: |
          set -euo pipefail
          cat > /tmp/human-test/create.py <<'PY'
          import bpy, sys, json, importlib, math, wave
          from mathutils import Vector

          base="/tmp/human-test"
          cues=json.load(open(base+"/cues.json",encoding="utf-8"))["mouthCues"]

          # Enable MPFB extension in background mode.
          enabled=False
          for module in ("bl_ext.blender_org.mpfb","mpfb"):
              try:
                  bpy.ops.preferences.addon_enable(module=module)
                  enabled=True
                  break
              except Exception:
                  pass
          if not enabled and not any("mpfb" in m.lower() for m in sys.modules):
              raise RuntimeError("MPFB extension could not be enabled")

          def get_api(suffix,symbol):
              for name in list(sys.modules):
                  if name.endswith(suffix):
                      mod=importlib.import_module(name)
                      if hasattr(mod,symbol):
                          return getattr(mod,symbol)
              raise RuntimeError("MPFB API missing: "+suffix)

          HumanService=get_api("mpfb.services.humanservice","HumanService")
          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete(use_global=False)

          human=HumanService.create_human()
          if human is None or human.type!="MESH" or len(human.data.vertices)<1000:
              raise RuntimeError("MPFB did not create a full human mesh")

          rig=HumanService.add_builtin_rig(human,"default")
          if rig is None or rig.type!="ARMATURE":
              raise RuntimeError("MPFB default rig creation failed")


          # ---- TEMP DIAGNOSTIC v3: read-only, restores state, exits before render ----
          import os, re, time
          from array import array
          try:
              import numpy as np
          except Exception:
              np = None

          EPS_W, EPS_D, MIN_VERTS = 1e-4, 5e-4, 20
          ROT, LOC = 0.35, 0.01
          TIME_BUDGET, MAX_BONES, MAX_KEYS = 240, 80, 120
          T0 = time.time()
          FACE_RX = re.compile(r"jaw|chin|lip|mouth|oris|brow|lid|blink|tongue|cheek|nose|eye|levator|zygo|risorius|temporalis|orbicularis|special", re.I)

          def P(*a): print("[DIAG]", *a, flush=True)
          def late(): return time.time() - T0 > TIME_BUDGET
          def upd(): bpy.context.view_layer.update()
          def fmt(c): return None if c is None else tuple(round(v, 3) for v in c)

          def coords(obj):
              ev = obj.evaluated_get(bpy.context.evaluated_depsgraph_get())
              me = ev.to_mesh()
              try:
                  n = len(me.vertices)
                  buf = np.empty(n * 3, dtype=np.float32) if np else array("f", [0.0]) * (n * 3)
                  me.vertices.foreach_get("co", buf)
              finally:
                  ev.to_mesh_clear()
              return buf

          def measure(base, cur):
              if len(base) != len(cur): return -1, 0.0, None
              if np:
                  d = np.linalg.norm((cur - base).reshape(-1, 3), axis=1)
                  sel = d > EPS_D; n = int(sel.sum())
                  c = cur.reshape(-1, 3)[sel].mean(axis=0).tolist() if n else None
                  return n, (float(d.max()) if len(d) else 0.0), c
              n = 0; mx = 0.0; s = [0.0, 0.0, 0.0]
              for i in range(0, len(base), 3):
                  dx = cur[i] - base[i]; dy = cur[i+1] - base[i+1]; dz = cur[i+2] - base[i+2]
                  d = (dx*dx + dy*dy + dz*dz) ** 0.5
                  if d > mx: mx = d
                  if d > EPS_D:
                      n += 1; s[0] += cur[i]; s[1] += cur[i+1]; s[2] += cur[i+2]
              return n, mx, ([v / n for v in s] if n else None)

          def pose_state(pb):
              return (pb.rotation_mode, tuple(pb.location), tuple(pb.rotation_quaternion),
                      tuple(pb.rotation_euler), tuple(pb.scale))

          def set_pose(pb, s):
              pb.rotation_mode = s[0]; pb.location = s[1]; pb.rotation_quaternion = s[2]
              pb.rotation_euler = s[3]; pb.scale = s[4]

          def test_bone(pb, mesh, base):
              orig = pose_state(pb); best = (0, 0.0, None, "")
              try:
                  for kind in ("rot", "loc"):
                      for ax in range(3):
                          if late(): return best
                          set_pose(pb, orig)
                          if kind == "rot":
                              pb.rotation_mode = "XYZ"
                              e = list(pb.rotation_euler); e[ax] += ROT; pb.rotation_euler = e
                          else:
                              l = list(pb.location); l[ax] += LOC; pb.location = l
                          upd()
                          r = measure(base, coords(mesh))
                          if r[0] > best[0]: best = (r[0], r[1], r[2], kind + "XYZ"[ax])
                      if kind == "rot" and best[0] >= MIN_VERTS: break
              finally:
                  set_pose(pb, orig); upd()
              return best

          def _diag():
              upd()
              arms = [o for o in bpy.data.objects if o.type == "ARMATURE"]
              meshes = [o for o in bpy.data.objects if o.type == "MESH"]
              P("ENV blender", bpy.app.version_string, "numpy", np.__version__ if np else "MISSING->pure_python")
              pose_orig = {(a.name, pb.name): pose_state(pb) for a in arms for pb in a.pose.bones}
              mod_orig = {(m.name, x.name): x.show_viewport for m in meshes for x in m.modifiers}
              key_orig = {}
              for m in meshes:
                  if m.data.shape_keys:
                      for kb in m.data.shape_keys.key_blocks:
                          key_orig[(m.name, kb.name)] = (kb.value, kb.mute)
              try:
                  P("ARMATURES", [(a.name, len(a.pose.bones)) for a in arms])
                  allb = {}
                  for a in arms:
                      for pb in a.pose.bones:
                          allb[pb.name] = (a, pb)
                          P("BONE", a.name, pb.name, "parent=", pb.parent.name if pb.parent else None,
                            "deform=", pb.bone.use_deform, "constraints=", len(pb.constraints))
                      P("DRIVERS_ON_ARMATURE", a.name, len(a.animation_data.drivers) if a.animation_data else 0)
                  wcount = {}
                  for m in meshes:
                      mods = [x for x in m.modifiers if x.type == "ARMATURE"]
                      sk = m.data.shape_keys
                      P("MESH", m.name, "verts=", len(m.data.vertices), "parent=", m.parent.name if m.parent else None,
                        "parent_type=", m.parent_type, "parent_bone=", m.parent_bone or None,
                        "armature_mods=", [x.object.name if x.object else None for x in mods],
                        "all_mods=", [x.type for x in m.modifiers])
                      P("SHAPEKEYS", m.name, len(sk.key_blocks) if sk else 0,
                        [k.name for k in sk.key_blocks] if sk else [],
                        "drivers=", len(sk.animation_data.drivers) if sk and sk.animation_data else 0)
                      if not mods and m.parent_type != "BONE":
                          P("UNBOUND_MESH", m.name)
                      idx = {g.index: g.name for g in m.vertex_groups if g.name in allb}
                      cnt = {}
                      for v in m.data.vertices:
                          for g in v.groups:
                              n = idx.get(g.group)
                              if n and g.weight > EPS_W:
                                  cnt[n] = cnt.get(n, 0) + 1
                      wcount[m.name] = cnt

                  named = [n for n in allb if FACE_RX.search(n)]
                  head_desc = []
                  for a in arms:
                      for pb in a.pose.bones:
                          if pb.name.lower() == "head":
                              head_desc += [c.name for c in pb.children_recursive]
                  head_only = [n for n in dict.fromkeys(head_desc) if n not in named]
                  group = {}
                  for n in named: group[n] = "A_name_matched"
                  for n in head_only: group[n] = "B_head_descendant"
                  P("GROUP_A_NAME_MATCHED", len(named), named)
                  P("GROUP_B_HEAD_DESCENDANTS_NOT_NAME_MATCHED", len(head_only), head_only)

                  weighted = lambda n: any(wcount[k].get(n, 0) for k in wcount)
                  okb = lambda n: allb[n][1].bone.use_deform and weighted(n)
                  cand = [n for n in named + head_only if okb(n)][:MAX_BONES]
                  P("CANDIDATES", len(cand), "EXCLUDED_NONDEFORM_OR_UNWEIGHTED",
                    [n for n in group if n not in cand])

                  moved = {}
                  for m in meshes:
                      mods = [x for x in m.modifiers if x.type == "ARMATURE" and x.object]
                      if not mods: continue
                      for x in m.modifiers:
                          x.show_viewport = (x.type == "ARMATURE")
                      upd(); base = coords(m)
                      P("MESH_Z_RANGE", m.name, round(min(base[2::3]), 3), round(max(base[2::3]), 3))
                      for n in cand:
                          if late(): break
                          arm, pb = allb[n]
                          if wcount[m.name].get(n, 0) == 0 or not any(x.object == arm for x in mods):
                              continue
                          r = test_bone(pb, m, base)
                          P("BONE_MOVES_SKIN", n, group[n], m.name, "weighted_verts=", wcount[m.name][n],
                            "verts_moved=", r[0], "max_disp=", round(r[1], 5), "via=", r[3], "centroid=", fmt(r[2]))
                          if r[0] >= MIN_VERTS:
                              moved.setdefault(n, []).append(m.name)
                      for x in m.modifiers:
                          x.show_viewport = mod_orig[(m.name, x.name)]
                      upd()

                  kmoved = []
                  for m in meshes:
                      sk = m.data.shape_keys
                      if not sk or len(sk.key_blocks) < 2: continue
                      for x in m.modifiers:
                          x.show_viewport = False
                      upd(); base = coords(m)
                      for kb in list(sk.key_blocks)[1:MAX_KEYS + 1]:
                          if late(): break
                          v0, mu0 = kb.value, kb.mute
                          try:
                              kb.mute = False
                              kb.value = 1.0 if v0 < 0.5 else 0.0
                              upd(); r = measure(base, coords(m))
                          finally:
                              kb.value, kb.mute = v0, mu0
                              upd()
                          P("SHAPEKEY_MOVES_SKIN", m.name, kb.name, "verts_moved=", r[0],
                            "max_disp=", round(r[1], 5), "centroid=", fmt(r[2]))
                          if r[0] >= MIN_VERTS:
                              kmoved.append(m.name + ":" + kb.name)
                      for x in m.modifiers:
                          x.show_viewport = mod_orig[(m.name, x.name)]
                      upd()

                  for g in ("A_name_matched", "B_head_descendant"):
                      lst = sorted(n for n in moved if group[n] == g)
                      P("VERDICT_MOVING_SKIN_" + g, len(lst), lst)
                  P("VERDICT_SHAPEKEYS_MOVING_SKIN", len(kmoved), kmoved[:60])
                  P("TIME_BUDGET_EXCEEDED", late())

                  rx = r"pose|face|expression|viseme|shape|target|rig"
                  for name, mod in list(sys.modules.items()):
                      if mod and "mpfb" in name and "service" in name:
                          for a in dir(mod):
                              o = getattr(mod, a, None)
                              if isinstance(o, type) and getattr(o, "__module__", "") == name:
                                  ms = [x for x in dir(o) if re.search(rx, x, re.I) and not x.startswith("__")]
                                  if ms: P("MPFB_API", name + "." + a, ms)

                  root = next((os.path.dirname(os.path.dirname(mm.__file__)) for nn, mm in sys.modules.items()
                               if mm and nn.endswith("mpfb.services") and getattr(mm, "__file__", None)), None)
                  P("MPFB_ROOT", root); c = 0
                  for dp, _, fs in os.walk(root or "/nonexistent"):
                      for f in fs:
                          full = os.path.join(dp, f)
                          if re.search(r"viseme|phoneme|expression|facepose|arkit|rigs", full, re.I) and c < 150:
                              P("MPFB_FILE", os.path.relpath(full, root)); c += 1
                  P("HUMAN_DIAG_COMPLETE", "seconds=", round(time.time() - T0, 1))
              finally:
                  for (an, bn), state in pose_orig.items():
                      set_pose(bpy.data.objects[an].pose.bones[bn], state)
                  for (mn, xn), value in mod_orig.items():
                      bpy.data.objects[mn].modifiers[xn].show_viewport = value
                  for (mn, kn), (value, mute) in key_orig.items():
                      kb = bpy.data.objects[mn].data.shape_keys.key_blocks[kn]
                      kb.value, kb.mute = value, mute
                  upd()

          rc = 0
          try:
              _diag()
          except Exception:
              import traceback
              traceback.print_exc()
              P("DIAG_ERROR")
              rc = 1
          finally:
              sys.stdout.flush()
              sys.stderr.flush()
          sys.exit(rc)

          # Simple skin material; no optional asset packs or production files.
          mat=bpy.data.materials.new("Test Human Skin")
          mat.diffuse_color=(0.48,0.25,0.16,1)
          mat.use_nodes=True
          mat.node_tree.nodes["Principled BSDF"].inputs["Base Color"].default_value=(0.48,0.25,0.16,1)
          human.data.materials.clear()
          human.data.materials.append(mat)

          bpy.context.view_layer.update()
          corners=[human.matrix_world @ Vector(c) for c in human.bound_box]
          lo=Vector((min(v.x for v in corners),min(v.y for v in corners),min(v.z for v in corners)))
          hi=Vector((max(v.x for v in corners),max(v.y for v in corners),max(v.z for v in corners)))
          h=hi.z-lo.z
          if h<1:
              raise RuntimeError("Invalid human dimensions")

          # Audio-timed mouth aperture, driven by Rhubarb's detected cues.
          bpy.ops.mesh.primitive_uv_sphere_add(segments=32,ring_count=16,
              location=((lo.x+hi.x)/2,lo.y-0.012,lo.z+h*0.865))
          mouth=bpy.context.object
          mouth.name="Arabic Audio Driven Mouth"
          mouth.scale=(h*0.030,h*0.003,h*0.004)
          mm=bpy.data.materials.new("Mouth Interior")
          mm.diffuse_color=(0.025,0.004,0.008,1)
          mouth.data.materials.append(mm)

          with wave.open(base+"/arabic.wav","rb") as wav:
              duration=wav.getnframes()/wav.getframerate()
          fps=24
          # Short smoke render: maximum 24 frames (1 second).
          end_frame=min(24,max(2,math.ceil(duration*fps)))
          scene=bpy.context.scene
          scene.render.engine="BLENDER_EEVEE_NEXT"
          scene.eevee.taa_render_samples=8
          scene.render.resolution_x=480
          scene.render.resolution_y=854
          scene.render.resolution_percentage=100
          scene.render.fps=fps
          scene.frame_start=1
          scene.frame_end=end_frame
          scene.render.image_settings.file_format="PNG"
          scene.render.filepath=base+"/frame_"

          # Animate a real arm bone and torso bone on the MPFB skeleton.
          names=set(rig.data.bones.keys())
          arm_name=next((n for n in ("upperarm01.L","upperarm02.L","upperarm01.R","upperarm02.R","upper_arm.L","upperarm.L","upper_arm.R","upperarm.R") if n in names),None)
          if not arm_name:
              raise RuntimeError("MPFB upper-arm bone was not found")
          frames=[1,max(2,end_frame//3),max(3,2*end_frame//3),end_frame]
          arm=rig.pose.bones[arm_name]
          arm.rotation_mode="XYZ"
          for f,a in zip(frames,(-0.08,0.55,-0.18,0.35)):
              arm.rotation_euler[1]=a
              arm.keyframe_insert(data_path="rotation_euler",frame=f)

          spine_name=next((n for n in ("spine01","spine02","spine","spine1","spine_01") if n in names),None)
          if spine_name:
              spine=rig.pose.bones[spine_name]
              spine.rotation_mode="XYZ"
              for f,a in zip(frames,(0,0.035,-0.025,0)):
                  spine.rotation_euler[1]=a
                  spine.keyframe_insert(data_path="rotation_euler",frame=f)

          aperture={"X":0.10,"A":0.25,"B":0.42,"C":0.62,"D":0.95,
                    "E":0.82,"F":0.72,"G":0.56,"H":0.38}
          for cue in cues:
              start=max(1,round(float(cue["start"])*fps)+1)
              end=max(start+1,round(float(cue["end"])*fps)+1)
              amount=aperture.get(str(cue["value"]).upper(),0.15)
              for f,value in ((start,amount),(end,0.10)):
                  mouth.scale.z=h*0.004*max(0.15,value)
                  mouth.keyframe_insert(data_path="scale",frame=f)

          if not mouth.animation_data or not mouth.animation_data.action:
              raise RuntimeError("No audio-driven mouth animation was created")

          target=Vector(((lo.x+hi.x)/2,(lo.y+hi.y)/2,lo.z+h*0.72))
          bpy.ops.object.camera_add(location=(target.x,lo.y-h*2.7,lo.z+h*0.78))
          cam=bpy.context.object
          cam.rotation_euler=(target-cam.location).to_track_quat("-Z","Y").to_euler()
          cam.data.lens=52
          scene.camera=cam

          bpy.ops.object.light_add(type="AREA",location=(target.x-h,lo.y-h*1.5,lo.z+h*1.7))
          light=bpy.context.object
          light.data.energy=850
          light.data.size=h*1.2
          scene.world.color=(0.12,0.12,0.12)

          print("MPFB_HUMAN_VERTICES",len(human.data.vertices))
          print("MPFB_RIG_BONES",len(rig.data.bones))
          print("ANIMATED_ARM_BONE",arm_name)
          print("AUDIO_DERIVED_MOUTH_CUES",len(cues))
          if len(rig.data.bones)<20:
              raise RuntimeError("Rig validation failed")
          bpy.ops.render.render(animation=True)
          print("HUMAN_ARABIC_LIPSYNC_RENDER_COMPLETE")
          PY

          blender --background --python /tmp/human-test/create.py 2>&1 | tee /tmp/human-test/render.log
          { echo '```text'; grep -F '[DIAG]' /tmp/human-test/render.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q HUMAN_DIAG_COMPLETE /tmp/human-test/render.log

      - name: Encode and validate video
        if: ${{ false }}
        run: |
          set -euo pipefail
          ffmpeg -y -framerate 24 -i /tmp/human-test/frame_%04d.png \
            -i /tmp/human-test/arabic.wav \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            -c:a aac -b:a 128k -shortest -movflags +faststart \
            /tmp/human-test/human-arabic-lipsync.mp4
          ffprobe -v error -show_entries format=duration \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of json /tmp/human-test/human-arabic-lipsync.mp4
          test -s /tmp/human-test/human-arabic-lipsync.mp4
          echo "HUMAN_ARABIC_LIPSYNC_TEST_SUCCESS"

      - name: Upload test results
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: human-arabic-lipsync-test
          path: |
            /tmp/human-test/human-arabic-lipsync.mp4
            /tmp/human-test/render.log
            /tmp/human-test/cues.json
          retention-days: 3
