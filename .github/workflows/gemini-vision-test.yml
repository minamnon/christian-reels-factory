name: Gemini Vision Image Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run real Gemini Vision image test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python tools/gemini_vision_test.py

      - name: Upload original images and Vision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-vision-test-${{ github.run_id }}
          path: artifacts/gemini-vision-test/
          if-no-files-found: warn
          retention-days: 7
